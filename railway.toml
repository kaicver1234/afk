[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Xvfb is started by start.sh (see Dockerfile) — node needs its GLX display.
startCommand = "start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Set DATA_DIR to a mounted volume path (e.g. /data) or userdata.json is wiped
# on every deploy.
