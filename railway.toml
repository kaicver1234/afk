[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# headless-gl needs a GLX display; xvfb-run provides one.
startCommand = "xvfb-run -a node index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Set DATA_DIR to a mounted volume path (e.g. /data) or userdata.json is wiped
# on every deploy.
